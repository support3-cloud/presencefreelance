<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre de présence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#F7F1E3; --paper-line:#e3d9c2; --ink:#1C2B22; --ink-soft:#57604f;
    --stamp:#B4502F; --stamp-soft:#f8e3d6; --accent:#1F8A6C; --accent-soft:#d9f0e6;
    --gold:#C9861F; --gold-soft:#f7e8cc; --berry:#A13D64; --berry-soft:#f6dfe8;
    --white:#FFFDF9; --radius:12px; --shadow:0 1px 2px rgba(28,43,34,.05), 0 10px 28px rgba(28,43,34,.08);
    --shadow-sm:0 1px 2px rgba(28,43,34,.06), 0 3px 10px rgba(28,43,34,.06);
    --warn:#a8791f; --warn-soft:#f6ecd6;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--paper);background-image:linear-gradient(var(--paper-line) 1px, transparent 1px);background-size:100% 42px;font-family:'Inter',sans-serif;color:var(--ink);padding:0 0 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;padding-bottom:14px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--gold),var(--berry)) 1;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;}
  .brand span{color:var(--stamp);}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;letter-spacing:.02em;}
  .badge-gold{background:var(--gold-soft);color:var(--gold);}
  .badge-berry{background:var(--berry-soft);color:var(--berry);}
  .card{background:var(--white);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:20px;transition:box-shadow .15s ease;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 14px;font-weight:700;letter-spacing:-0.01em;}
  h3{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0 0 10px;font-weight:700;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;}
  input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 13px;border:1px solid #d8cfb8;border-radius:8px;font-family:'Inter',sans-serif;font-size:15px;background:#fff;color:var(--ink);transition:border-color .12s ease, box-shadow .12s ease;}
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:160px;}
  button{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;border:none;border-radius:8px;padding:12px 18px;cursor:pointer;transition:transform .05s ease, box-shadow .15s ease, background .15s ease;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:#233329;box-shadow:0 4px 12px rgba(28,43,34,.25);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:#186f57;box-shadow:0 4px 14px rgba(31,138,108,.32);}
  .btn-stamp{background:var(--stamp);color:#fff;}
  .btn-stamp:hover{background:#943f24;box-shadow:0 4px 14px rgba(180,80,47,.32);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:hover{background:#a86f16;box-shadow:0 4px 14px rgba(201,134,31,.32);}
  .btn-berry{background:var(--berry);color:#fff;}
  .btn-berry:hover{background:#84314f;box-shadow:0 4px 14px rgba(161,61,100,.32);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid #d8cfb8;}
  .btn-ghost:hover{background:#f3ede0;border-color:#c2b697;}
  .btn-sm{padding:7px 12px;font-size:11px;}
  .btn-role{width:100%;padding:16px 18px;font-size:13.5px;margin-bottom:10px;text-align:left;display:flex;align-items:center;gap:12px;border:none;}
  .btn-role .role-icon{font-size:19px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tabs button{flex:1;}
  .tabs [data-tab]{border-radius:999px;padding:9px 16px;flex:none;}
  .muted{color:var(--ink-soft);font-size:13.5px;line-height:1.55;}
  canvas.sigpad{width:100%;height:150px;border:1.5px dashed #c2b697;border-radius:10px;background:#fff;touch-action:none;display:block;}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;border-radius:10px;border:1px solid var(--paper-line);}
  .table-scroll table{margin-bottom:0;min-width:640px;border:none;}
  .table-scroll table th:first-child,.table-scroll table td:first-child{padding-left:12px;}
  .table-scroll table th:last-child,.table-scroll table td:last-child{padding-right:12px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);background:#faf5e9;}
  tbody tr:hover{background:#faf5e9;}
  td select,td input[type=time],td input[type=text]{width:100px;padding:6px 8px;font-size:13px;}
  .sig-thumb{width:64px;height:28px;object-fit:contain;background:#fff;border:1px solid var(--paper-line);border-radius:5px;cursor:zoom-in;transition:transform .1s ease;}
  .sig-thumb:hover{transform:scale(1.08);}
  .event-item{border:1px solid var(--paper-line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#fff;transition:box-shadow .15s ease, border-color .15s ease;}
  .event-item:hover{box-shadow:var(--shadow-sm);border-color:#c7c4b8;border-left-color:var(--gold);}
  .event-info{flex:1;min-width:180px;}
  .event-name{font-weight:600;font-size:15.5px;}
  .event-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .event-date-range{text-align:center;}
  .qr-box{background:#fff;padding:8px;border-radius:8px;border:1px solid var(--paper-line);box-shadow:var(--shadow-sm);}
  .link-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .link-row code{font-family:'IBM Plex Mono',monospace;font-size:11px;background:#f3ede0;padding:4px 7px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
  .stamp-mark{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--stamp);border:2.5px solid var(--stamp);display:inline-block;padding:10px 18px;border-radius:8px;transform:rotate(-3deg);letter-spacing:.05em;text-transform:uppercase;font-size:15px;background:var(--stamp-soft);box-shadow:0 4px 14px rgba(180,80,47,.18);}
  .center{text-align:center;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif;box-shadow:0 6px 20px rgba(28,43,34,.3);z-index:50;opacity:0;transition:opacity .2s ease;}
  .toast.show{opacity:1;}
  .backlink{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);text-decoration:none;cursor:pointer;}
  .backlink:hover{color:var(--accent);}
  .modal-bg{position:fixed;inset:0;background:rgba(28,43,34,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(28,43,34,.35);}
  .recup-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-top:14px;font-size:13.5px;line-height:1.7;}
  .warn-box{background:var(--warn-soft);border:1px solid var(--warn);color:#5c421a;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .acc-item{border:1px solid var(--paper-line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .acc-header{width:100%;display:flex;align-items:center;gap:10px;background:#faf5e9;border:none;padding:14px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);}
  .acc-header:hover{background:#f3ecd9;}
  .acc-header .acc-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:999px;padding:3px 10px;margin-left:auto;font-weight:600;}
  .acc-chevron{font-size:12px;color:var(--ink-soft);transition:transform .15s ease;}
  .acc-header[aria-expanded="true"] .acc-chevron{transform:rotate(90deg);}
  .acc-content{padding:16px;background:#fff;}
  ::placeholder{color:#b7b4a6;}
  @media (max-width:520px){ .wrap{padding:20px 14px;} .event-item{padding:14px;gap:14px;} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>

<script type="module">
/* ============================================================
   CONFIGURATION — à remplir une seule fois
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDX_7HKuibEkjrZ4BtPtLlQar14QCEzCAM",
  authDomain: "presencefreelance.firebaseapp.com",
  projectId: "presencefreelance",
  storageBucket: "presencefreelance.firebasestorage.app",
  messagingSenderId: "906210160696",
  appId: "1:906210160696:web:3aa223387fe90583c176cd"
};
const ADMIN_CODE = "1234"; // à personnaliser

// Colle ici l'URL de ton Google Apps Script Web App pour activer la synchro Google Sheet.
// Laisse vide ("") pour désactiver la synchro — l'app fonctionne normalement sans.
const GOOGLE_SHEETS_URL = "";

const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "VOTRE_API_KEY";
let db = null, fs = null;
if(isConfigured){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
  fs = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
  db = fs.getFirestore(initializeApp(firebaseConfig));
}

let adminAuthed = false;
let sigPadCtx = null, sigDrawing = false, sigHasContent = false;
let selectedRole = null; // 'staff' | 'freelance_fixe' | 'externe' | 'autre'

// ---------- Utils ----------
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(s){ return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDateFR(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function eventDates(ev){
  return {
    debut: ev.dateDebut || ev.date || null,
    evenement: ev.dateEvenement || ev.date || null,
    fin: ev.dateFin || ev.date || null
  };
}
function eventDateRangeLabel(ev){
  const d = eventDates(ev);
  if(d.debut && d.fin && d.debut!==d.fin){
    return `${fmtDateFR(d.debut)} → ${fmtDateFR(d.fin)}${d.evenement?` · Jour J : ${fmtDateFR(d.evenement)}`:""}`;
  }
  return fmtDateFR(d.evenement || d.debut || d.fin);
}
function parseDateFR(str){ const m=(str||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return null; return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
function autoSlashDate(input){
  input.addEventListener("input", ()=>{
    let v = input.value.replace(/[^\d]/g,"").slice(0,8);
    if(v.length>=5) v=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
    else if(v.length>=3) v=v.slice(0,2)+"/"+v.slice(2);
    input.value=v;
  });
}
function nowTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(showToast._to); showToast._to=setTimeout(()=>t.classList.remove("show"),2600); }
function currentBaseUrl(){ return window.location.href.split("#")[0]; }

// ---------- Identité de l'appareil (empêche de signer pour quelqu'un d'autre) ----------
function getDeviceIdentity(){
  try{ const raw = localStorage.getItem("stagein_device_identity"); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function setDeviceIdentity(nom,prenom){
  try{ localStorage.setItem("stagein_device_identity", JSON.stringify({nom,prenom})); }catch(e){}
}
function clearDeviceIdentity(){ try{ localStorage.removeItem("stagein_device_identity"); }catch(e){} }
function nameFieldsBlock(idNom, idPrenom){
  const identity = getDeviceIdentity();
  if(identity){
    return `
      <div class="row">
        <div class="field"><label>Nom</label><input type="text" id="${idNom}" value="${esc(identity.nom)}" readonly style="background:#f2f1eb;"></div>
        <div class="field"><label>Prénom</label><input type="text" id="${idPrenom}" value="${esc(identity.prenom)}" readonly style="background:#f2f1eb;"></div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:-8px;margin-bottom:14px;">Cet appareil est associé à ce nom. <a class="backlink" id="changeIdentityLink" style="text-decoration:underline;">Ce n'est pas vous ?</a></p>`;
  }
  return `
    <div class="row">
      <div class="field"><label>Nom</label><input type="text" id="${idNom}"></div>
      <div class="field"><label>Prénom</label><input type="text" id="${idPrenom}"></div>
    </div>`;
}
function wireChangeIdentityLink(rerenderFn){
  const el = document.getElementById("changeIdentityLink");
  if(!el) return;
  el.onclick = ()=>{
    const code = prompt("Code administrateur requis pour changer l'identité associée à cet appareil :");
    if(code===null) return;
    if(code === ADMIN_CODE){ clearDeviceIdentity(); showToast("Identité réinitialisée"); rerenderFn(); }
    else showToast("Code incorrect");
  };
}

// Verrouille la session après une sortie/fin de journée : plus aucun bouton actif,
// il faut rouvrir le lien (rescanner le QR) pour faire une nouvelle entrée.
function renderSessionEnded(ev, nom, prenom, subtitle, detailHtml){
  document.getElementById("app").innerHTML = `
    <header class="top"><div class="brand">Registre<span>·</span></div><div class="tag">${esc(ev.name)} — ${eventDateRangeLabel(ev)}</div></header>
    <div class="card center">
      <div class="stamp-mark">Sortie enregistrée</div>
      <p class="muted" style="margin-top:16px;">${esc(prenom)} ${esc(nom)}${subtitle?` — ${esc(subtitle)}`:""}</p>
      ${detailHtml||""}
      <p class="muted" style="margin-top:14px;font-size:12px;">Votre session est terminée. Fermez cette page — pour un nouveau shift, rescannez le QR code.</p>
    </div>`;
}
function buildTimeOptions(selected){
  let opts = "";
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=15){
      const val = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
      opts += `<option value="${val}"${val===selected?" selected":""}>${val}</option>`;
    }
  }
  return opts;
}
function hoursBetween(hStart,hEnd){
  const [h1,m1]=hStart.split(":").map(Number), [h2,m2]=hEnd.split(":").map(Number);
  let start=h1*60+m1, end=h2*60+m2;
  if(end<start) end+=24*60;
  return (end-start)/60;
}
function toMinutesTotal(dateISO,timeStr){ return new Date(dateISO+"T"+timeStr+":00").getTime()/60000; }
function hoursDiffAcrossDates(d1,t1,d2,t2){ return (toMinutesTotal(d2,t2)-toMinutesTotal(d1,t1))/60; }
function normalHoursForDate(dateISO){
  const day = new Date(dateISO+"T00:00:00").getDay(); // 0=Dim, 6=Sam
  if(day===0) return 0;
  if(day===6) return 3;
  return 8;
}
function isSundayISO(dateISO){ return new Date(dateISO+"T00:00:00").getDay()===0; }

async function pushToSheet(sheetName, row){
  if(!GOOGLE_SHEETS_URL) return;
  try{
    await fetch(GOOGLE_SHEETS_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({sheet:sheetName, row}) });
  }catch(e){ console.error("Sync Google Sheet échouée", e); }
}

// ---------- Firestore: events ----------
async function getEvent(id){ try{ const s=await fs.getDoc(fs.doc(db,"events",id)); return s.exists()?s.data():null; }catch(e){ console.error(e); return null; } }
async function saveEvent(id,data){ try{ await fs.setDoc(fs.doc(db,"events",id),data); return true; }catch(e){ console.error(e); return false; } }
async function deleteEventDoc(id){ try{ await fs.deleteDoc(fs.doc(db,"events",id)); return true; }catch(e){ console.error(e); return false; } }
async function loadEvents(){
  try{ const snap=await fs.getDocs(fs.collection(db,"events")); const ev=snap.docs.map(d=>d.data()); ev.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); return ev; }
  catch(e){ console.error(e); return []; }
}

// ---------- Firestore: shifts (staff / freelance fixe) ----------
async function startShift(role,pj,nom,prenom,heureDebut,eventId){
  const date = todayStr();
  const nomSlug=slugify(nom), prenomSlug=slugify(prenom);
  const qOpen = fs.query(fs.collection(db,"shifts"), fs.where("pj","==",pj), fs.where("nomSlug","==",nomSlug), fs.where("prenomSlug","==",prenomSlug), fs.where("date","==",date), fs.where("heureFinJour","==",null));
  const openSnap = await fs.getDocs(qOpen);
  if(!openSnap.empty) return {ok:false, msg:"Un shift est déjà en cours pour ce PJ aujourd'hui — terminez-le avant d'en commencer un nouveau."};

  let restWarning = false;
  try{
    const qAll = fs.query(fs.collection(db,"shifts"), fs.where("nomSlug","==",nomSlug), fs.where("prenomSlug","==",prenomSlug));
    const snap = await fs.getDocs(qAll);
    const closed = snap.docs.map(d=>d.data()).filter(s=>s.heureFinJour).sort((a,b)=> (b.date+b.heureFinJour).localeCompare(a.date+a.heureFinJour));
    if(closed.length){
      const gap = hoursDiffAcrossDates(closed[0].date, closed[0].heureFinJour, date, heureDebut);
      if(gap < 12) restWarning = true;
    }
  }catch(e){ console.error(e); }

  const row = { role, pj, eventId, nom, prenom, nomSlug, prenomSlug, date, heureDebut, heureFinJour:null, commentaire:"", restWarning, createdTs: Date.now() };
  try{
    await fs.addDoc(fs.collection(db,"shifts"), row);
    pushToSheet("Shifts", {...row, statut:"début"});
    return {ok:true};
  }catch(e){ console.error(e); return {ok:false, msg:"Erreur d'enregistrement, réessayez."}; }
}

async function endShift(pj,nom,prenom,heureFin,commentaire){
  const date = todayStr();
  const nomSlug=slugify(nom), prenomSlug=slugify(prenom);
  try{
    const qOpen = fs.query(fs.collection(db,"shifts"), fs.where("pj","==",pj), fs.where("nomSlug","==",nomSlug), fs.where("prenomSlug","==",prenomSlug), fs.where("date","==",date), fs.where("heureFinJour","==",null));
    const snap = await fs.getDocs(qOpen);
    if(snap.empty) return {ok:false, msg:"Aucun shift en cours trouvé aujourd'hui pour ce PJ — commencez d'abord un shift."};
    const docSnap = snap.docs[0];
    await fs.updateDoc(fs.doc(db,"shifts",docSnap.id), { heureFinJour: heureFin, commentaire: commentaire||"" });

    const qToday = fs.query(fs.collection(db,"shifts"), fs.where("pj","==",pj), fs.where("nomSlug","==",nomSlug), fs.where("prenomSlug","==",prenomSlug), fs.where("date","==",date));
    const snapToday = await fs.getDocs(qToday);
    let totalWorked = 0;
    snapToday.docs.forEach(d=>{ const s=d.data(); if(s.heureFinJour) totalWorked += hoursBetween(s.heureDebut, s.heureFinJour); });
    const normal = normalHoursForDate(date);
    const recupToday = Math.max(0, totalWorked - normal);
    const sundayBonus = isSundayISO(date) && totalWorked >= 8;

    const project = await computeProjectRecup(pj,nom,prenom);
    pushToSheet("Shifts", { pj, nom, prenom, date, heureFin, commentaire, statut:"fin", totalWorked, recupToday, sundayBonus });
    return {ok:true, totalWorked, normal, recupToday, sundayBonus, project};
  }catch(e){ console.error(e); return {ok:false, msg:"Erreur d'enregistrement, réessayez."}; }
}

async function computeProjectRecup(pj,nom,prenom){
  const nomSlug=slugify(nom), prenomSlug=slugify(prenom);
  try{
    const q = fs.query(fs.collection(db,"shifts"), fs.where("pj","==",pj), fs.where("nomSlug","==",nomSlug), fs.where("prenomSlug","==",prenomSlug));
    const snap = await fs.getDocs(q);
    const byDate = {};
    snap.docs.forEach(d=>{ const s=d.data(); if(!s.heureFinJour) return; if(!byDate[s.date]) byDate[s.date]=0; byDate[s.date]+=hoursBetween(s.heureDebut,s.heureFinJour); });
    let totalRecup=0, bonusDays=0;
    Object.keys(byDate).forEach(date=>{
      const worked = byDate[date], normal = normalHoursForDate(date);
      totalRecup += Math.max(0, worked-normal);
      if(isSundayISO(date) && worked>=8) bonusDays++;
    });
    return { totalRecupHeures: totalRecup, joursBonus: bonusDays };
  }catch(e){ console.error(e); return { totalRecupHeures:0, joursBonus:0 }; }
}

const DEFAULT_LEADERS = ["Lorenzo","Jason","Sylvain"];
async function getRates(){
  try{

      return data;
    }
  }catch(e){ console.error(e); }
  const rates = {};
  DEFAULT_LEADERS.forEach(l=>rates[l]={Tech:null,Deco:null});
  rates["Lorenzo"].Tech = 2500;
  const transport = { Lorenzo: 2000 };
  return { leaders: DEFAULT_LEADERS, rates, transport };
}

function computeTransport(count, leader, ratesData){
  if(count<=0) return 0;
  const perCar = (ratesData.transport && ratesData.transport[leader]!=null) ? Number(ratesData.transport[leader]) : 2000;
  return Math.ceil(count/5) * perCar;
}

function nowRounded(){
  const d = new Date();
  const m = Math.round(d.getMinutes()/15)*15;

  return String(h).padStart(2,"0")+":"+String(m===60?0:m).padStart(2,"0");
}

// ---- Signature pad (partagé) ----
function initSigPad(canvas){
  const ratio = window.devicePixelRatio || 1;
  canvas.width = (canvas.clientWidth||300)*ratio; canvas.height = 150*ratio;
  const ctx = canvas.getContext("2d"); ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#16221D";
  sigPadCtx = ctx; sigHasContent = false; sigDrawing = false;
  function pos(e){ const r=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; }
  function start(e){ sigDrawing=true; sigHasContent=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
}
function clearSigPad(){ const c=document.getElementById("sigPad"); if(!c||!sigPadCtx) return; sigPadCtx.clearRect(0,0,c.width,c.height); sigHasContent=false; }
function openSigModal(src){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML = `<div class="modal"><img src="${src}" style="width:100%;background:#fff;border-radius:6px;"></div>`;
  bg.onclick = ()=> bg.remove(); document.body.appendChild(bg);
}

async function createEvent(){
  const name = document.getElementById("evName").value.trim();
  const dJInput = document.getElementById("evDateEvenement").value.trim();
  const dDebutInput = document.getElementById("evDateDebut").value.trim();
  const dFinInput = document.getElementById("evDateFin").value.trim();
  const pjInput = document.getElementById("evPJ").value.trim().toUpperCase();
  if(!name){ showToast("Merci de nommer l'événement"); return false; }
  if(dJInput && !parseDateFR(dJInput)){ showToast("Format de date invalide (Jour J) — utilisez JJ/MM/AAAA"); return false; }
  if(dDebutInput && !parseDateFR(dDebutInput)){ showToast("Format de date invalide (Début) — utilisez JJ/MM/AAAA"); return false; }
  if(dFinInput && !parseDateFR(dFinInput)){ showToast("Format de date invalide (Fin) — utilisez JJ/MM/AAAA"); return false; }
  if(!/^PJ\d{5}$/.test(pjInput)){ showToast("PJ requis — format PJ12345"); return false; }
  const dateEvenement = parseDateFR(dJInput) || todayStr();
  const dateDebut = parseDateFR(dDebutInput) || dateEvenement;
  const dateFin = parseDateFR(dFinInput) || dateEvenement;
  const id = slugify(name)+"-"+Date.now().toString(36);
  const ev = { id, name, date: dateEvenement, dateDebut, dateEvenement, dateFin, pj: pjInput, createdAt: Date.now(), archived: false };
  const ok = await saveEvent(id, ev);
  if(ok){ showToast("Événement créé"); return true; }
  showToast("Erreur lors de la création — vérifiez votre configuration Firebase");
  return false;
}

  modal.querySelectorAll("[data-acc]").forEach(btn=>{
    btn.onclick = ()=>{

      const content = modal.querySelector(`[data-acc-content="${key}"]`);
      const isOpen = content.style.display !== "none";

      btn.setAttribute("aria-expanded", isOpen ? "false" : "true");
    };
  });

  const exportBtn = modal.querySelector("#exportBtn");
  if(exportBtn) exportBtn.onclick = ()=> exportEventExcel(ev, externes, autres, staffShifts, fixeShifts, recapRowsData(byLeader, ratesData), "all");
}
function recapRowsData(byLeader, ratesData){
  return Object.keys(byLeader).map(l=>{
    const d=byLeader[l]; const transport = computeTransport(d.count, l, ratesData);
    return { leader:l, count:d.count, tech:d.tech, deco:d.deco, remun:d.remun, transport, total:d.remun+transport };
  });
}

function exportEventExcel(ev, externes, autres, staffShifts, fixeShifts, recap, category){
  const wb = XLSX.utils.book_new();
  const shiftSheet = (list)=> list.map(s=>({ "PJ":s.pj,"Nom":s.nom,"Prénom":s.prenom,"Date":fmtDateFR(s.date),"Début":s.heureDebut||"","Fin":s.heureFinJour||"","Travaillé (h)":s.heureFinJour?hoursBetween(s.heureDebut,s.heureFinJour).toFixed(2):"","Commentaire":s.commentaire||"" }));

  if(category==="all" || category==="externe"){
    const wsExt = XLSX.utils.json_to_sheet(externes.map(r=>({ "Nom":r.nom,"Prénom":r.prenom,"PJ":r.pj||"","Catégorie":r.categorie,"Chef d'équipe":r.leader,"Date":fmtDateFR(r.date),"Arrivée":r.heureArrivee||"","Départ":r.heureDepart||"" })));
    XLSX.utils.book_append_sheet(wb, wsExt, "Freelances externes");
    const wsRecap = XLSX.utils.json_to_sheet(recap.map(r=>({ "Chef d'équipe":r.leader,"Pax":r.count,"Tech":r.tech,"Déco":r.deco,"Rémunération (Rs)":r.remun,"Transport (Rs)":r.transport,"Total (Rs)":r.total })));
    XLSX.utils.book_append_sheet(wb, wsRecap, "Récap financier");
  }
  if(category==="all" || category==="autre"){
    const wsAutre = XLSX.utils.json_to_sheet(autres.map(r=>({ "Nom":r.nom,"Prénom":r.prenom,"Date":fmtDateFR(r.date),"Arrivée":r.heureArrivee||"","Départ":r.heureDepart||"" })));
    XLSX.utils.book_append_sheet(wb, wsAutre, "Autre");
  }
  if(category==="all" || category==="staff"){
    const wsStaff = XLSX.utils.json_to_sheet(shiftSheet(staffShifts));
    XLSX.utils.book_append_sheet(wb, wsStaff, "Staff interne");
  }
  if(category==="all" || category==="freelance_fixe"){
    const wsFixe = XLSX.utils.json_to_sheet(shiftSheet(fixeShifts));
    XLSX.utils.book_append_sheet(wb, wsFixe, "Freelance fixe");
  }
  if(wb.SheetNames.length===0){ showToast("Rien à exporter pour cette catégorie"); return; }
  XLSX.writeFile(wb, `presences-${slugify(ev.name)}.xlsx`);
}

async function refreshShiftsTable(){
  const wrap = document.getElementById("shiftsTableWrap");
  if(!wrap) return;
  wrap.innerHTML = `<p class="muted">Chargement…</p>`;
  let shifts = (await loadAllShifts()).filter(s=>!s.archived);
  const fPJ = document.getElementById("filtPJ").value.trim().toUpperCase();
  const fNom = slugify(document.getElementById("filtNom").value.trim());
  const fPrenom = slugify(document.getElementById("filtPrenom").value.trim());
  const fDateInput = document.getElementById("filtDate").value.trim();
  const fDate = parseDateFR(fDateInput);
  if(fPJ) shifts = shifts.filter(s=>s.pj===fPJ);
  if(fNom) shifts = shifts.filter(s=>s.nomSlug.includes(fNom));
  if(fPrenom) shifts = shifts.filter(s=>s.prenomSlug.includes(fPrenom));
  if(fDate) shifts = shifts.filter(s=>s.date===fDate);
  shifts.sort((a,b)=> (b.date+((b.heureDebut)||"")).localeCompare(a.date+((a.heureDebut)||"")));

  if(shifts.length===0){ wrap.innerHTML = `<p class="muted">Aucun shift trouvé.</p>`; return; }
  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr><th>PJ</th><th>Rôle</th><th>Nom</th><th>Prénom</th><th>Date</th><th>Début</th><th>Fin</th><th>Travaillé</th><th>Commentaire</th><th></th></tr></thead>
      <tbody>
        ${shifts.map(s=>{
          const worked = s.heureFinJour ? hoursBetween(s.heureDebut,s.heureFinJour).toFixed(2)+"h" : "en cours";
          return `<tr data-id="${s.id}" style="white-space:nowrap;">
            <td>${esc(s.pj)}</td><td>${s.role==='staff'?'Staff':'Freelance fixe'}</td><td>${esc(s.nom)}</td><td>${esc(s.prenom)}</td><td>${fmtDateFR(s.date)}</td>

            <td><input type="time" value="${s.heureFinJour||''}" data-field="heureFinJour"></td>
            <td>${worked}${s.restWarning?' <span title="Repos < 12h depuis le shift précédent" class="muted">⚠︎</span>':''}</td>

          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>
    <button class="btn-primary btn-sm" id="exportShiftsBtn">Exporter en Excel</button>
    <div class="acc-item" style="margin-top:14px;">
      <button class="acc-header" data-acc="hoursTrash" aria-expanded="false">

        <span class="acc-chevron">▸</span>
      </button>
      <div class="acc-content" id="hoursTrashWrap" style="display:none;"></div>
    </div>`;

  wrap.querySelectorAll("[data-save-shift]").forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest("tr");
      const fields = {};
      tr.querySelectorAll("input[data-field]").forEach(inp=>{ fields[inp.dataset.field] = inp.value || null; });
      const ok = await updateShiftDoc(btn.dataset.saveShift, fields);
      showToast(ok ? "Heures mises à jour" : "Erreur d'enregistrement");
    };
  });
  wrap.querySelectorAll("[data-delete-shift]").forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm("Mettre cette ligne à la corbeille ?")) return;
      const ok = await updateShiftDoc(btn.dataset.deleteShift, { archived: true });
      if(ok){ showToast("Ligne mise à la corbeille"); await refreshShiftsTable(); }
      else showToast("Erreur");
    };
  });
  const hoursTrashWrap = document.getElementById("hoursTrashWrap");
  const toggleHoursTrashBtn = wrap.querySelector('[data-acc="hoursTrash"]');
  toggleHoursTrashBtn.onclick = async ()=>{
    const hidden = hoursTrashWrap.style.display === "none";
    hoursTrashWrap.style.display = hidden ? "block" : "none";
    toggleHoursTrashBtn.setAttribute("aria-expanded", hidden ? "true" : "false");
    if(hidden) await refreshHoursTrash();

    const ws = XLSX.utils.json_to_sheet(data);

    XLSX.utils.book_append_sheet(wb, ws, "Heures");
    XLSX.writeFile(wb, "heures-staff-freelance-fixe.xlsx");

  const archived = all.filter(s=>s.archived).sort((a,b)=> (b.date+((b.heureDebut)||"")).localeCompare(a.date+((a.heureDebut)||"")));
  if(archived.length===0){ trashWrap.innerHTML = `<p class="muted">La corbeille des heures est vide.</p>`; return; }

async function searchBudgetByPJ(){
  const pj = document.getElementById("budgetPJ").value.trim().toUpperCase();
  if(!/^PJ\d{5}$/.test(pj)){ showToast("Format PJ invalide — ex. PJ12345"); return; }
  showToast("Recherche en cours…");
  const [entries, ratesData] = await Promise.all([loadExternesByPJ(pj), getRates()]);
  const byLeader = {};
  entries.forEach(r=>{
    const l = r.leader || "Non précisé";
    if(!byLeader[l]) byLeader[l] = { count:0, tech:0, deco:0, remun:0, missing:0 };
    byLeader[l].count++;
    if(r.categorie==="Tech") byLeader[l].tech++; else byLeader[l].deco++;
    const rate = (ratesData.rates[l]||{})[r.categorie];
    if(rate!=null) byLeader[l].remun += Number(rate);
    else byLeader[l].missing++;
  });
  let grandTotal = 0;
  const recap = Object.keys(byLeader).map(l=>{
    const d = byLeader[l]; const transport = computeTransport(d.count, l, ratesData); const total=d.remun+transport; grandTotal+=total;
    return { leader:l, ...d, transport, total };
  });

  const byPerson = {};
  entries.forEach(r=>{
    const key = r.nomSlug+"|"+r.prenomSlug;
    if(!byPerson[key]) byPerson[key] = { nom:r.nom, prenom:r.prenom, dates:new Set() };
    byPerson[key].dates.add(r.date);
  });
  const personRows = Object.values(byPerson).map(p=>{
    const sortedDates = Array.from(p.dates).sort().map(fmtDateFR).join(", ");
    return `<tr><td style="white-space:nowrap;">${esc(p.nom)}</td><td style="white-space:nowrap;">${esc(p.prenom)}</td><td style="white-space:nowrap;">${p.dates.size}</td><td>${sortedDates}</td></tr>`;
  }).join("");

  const bodyHtml = `
    ${entries.length===0 ? `<p class="muted">Aucun freelance externe trouvé pour ${esc(pj)}.</p>` : `
    <div class="acc-item">
      <button class="acc-header" data-acc="jours" aria-expanded="false">
        <span>Jours travaillés par personne</span>
        <span class="acc-count">${Object.keys(byPerson).length}</span>
        <span class="acc-chevron">▸</span>
      </button>
      <div class="acc-content" data-acc-content="jours" style="display:none;">
        <div class="table-scroll"><table>
          <thead><tr><th>Nom</th><th>Prénom</th><th>Nb jours</th><th>Dates</th></tr></thead>
          <tbody>${personRows}</tbody>
        </table></div>
      </div>
    </div>

    <div class="acc-item">
      <button class="acc-header" data-acc="entrees" aria-expanded="false">
        <span>Entrées</span>
        <span class="acc-count">${entries.length}</span>
        <span class="acc-chevron">▸</span>
      </button>
      <div class="acc-content" data-acc-content="entrees" style="display:none;">
        <div class="table-scroll"><table>
          <thead><tr><th>Nom</th><th>Prénom</th><th>Catégorie</th><th>Chef d'équipe</th><th>Date</th><th>Arrivée</th><th>Départ</th></tr></thead>
          <tbody>${entries.map(r=>`<tr style="white-space:nowrap;"><td>${esc(r.nom)}</td><td>${esc(r.prenom)}</td><td>${r.categorie==='Tech'?'Tech':'Déco'}</td><td>${esc(r.leader)}</td><td>${fmtDateFR(r.date)}</td><td>${r.heureArrivee||''}</td><td>${r.heureDepart||''}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>
    </div>

    <div class="acc-item">
      <button class="acc-header" data-acc="cout" aria-expanded="false">
        <span>Coût par chef d'équipe (Rs)</span>
        <span class="acc-count">${recap.length}</span>
        <span class="acc-chevron">▸</span>
      </button>
      <div class="acc-content" data-acc-content="cout" style="display:none;">
        <div class="table-scroll"><table>
          <thead><tr><th>Chef d'équipe</th><th>Pax</th><th>Tech</th><th>Déco</th><th>Rémunération</th><th>Transport</th><th>Total</th></tr></thead>
          <tbody>${recap.map(r=>`<tr style="white-space:nowrap;"><td>${esc(r.leader)}</td><td>${r.count}</td><td>${r.tech}</td><td>${r.deco}</td><td>Rs ${r.remun.toLocaleString('fr-FR')}${r.missing?` <span class="muted">(${r.missing} tarif manquant)</span>`:""}</td><td>Rs ${r.transport.toLocaleString('fr-FR')}</td><td><strong>Rs ${r.total.toLocaleString('fr-FR')}</strong></td></tr>`).join("")}</tbody>
        </table></div>
        <p class="muted">Coût total pour ${esc(pj)} : <strong>Rs ${grandTotal.toLocaleString('fr-FR')}</strong></p>
      </div>
    </div>

    <button class="btn-primary btn-sm" id="exportBudgetBtn" style="margin-top:6px;">Exporter en Excel</button>
    `}`;
  const modal = openPanelModal(`Budget — ${esc(pj)}`, bodyHtml);
  modal.querySelectorAll("[data-acc]").forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.acc;
      const content = modal.querySelector(`[data-acc-content="${key}"]`);
      const isOpen = content.style.display !== "none";
      content.style.display = isOpen ? "none" : "block";
      btn.setAttribute("aria-expanded", isOpen ? "false" : "true");
    };
  });
  const exportBtn = modal.querySelector("#exportBudgetBtn");
  if(exportBtn) exportBtn.onclick = ()=> exportBudgetExcel(pj, entries, recap, grandTotal, byPerson);
}

function exportBudgetExcel(pj, entries, recap, grandTotal, byPerson){
  const wb = XLSX.utils.book_new();
  const wsPersons = XLSX.utils.json_to_sheet(Object.values(byPerson||{}).map(p=>({ "Nom":p.nom,"Prénom":p.prenom,"Nb jours":p.dates.size,"Dates":Array.from(p.dates).sort().map(fmtDateFR).join(", ") })));
  XLSX.utils.book_append_sheet(wb, wsPersons, "Jours par personne");
  const wsEntries = XLSX.utils.json_to_sheet(entries.map(r=>({ "Nom":r.nom,"Prénom":r.prenom,"Catégorie":r.categorie,"Chef d'équipe":r.leader,"Date":fmtDateFR(r.date),"Arrivée":r.heureArrivee||"","Départ":r.heureDepart||"" })));
  XLSX.utils.book_append_sheet(wb, wsEntries, "Entrées");
  const wsRecap = XLSX.utils.json_to_sheet(recap.map(r=>({ "Chef d'équipe":r.leader,"Pax":r.count,"Tech":r.tech,"Déco":r.deco,"Rémunération (Rs)":r.remun,"Transport (Rs)":r.transport,"Total (Rs)":r.total })));
  XLSX.utils.book_append_sheet(wb, wsRecap, "Coût par chef d'équipe");
  XLSX.writeFile(wb, `budget-${pj}.xlsx`);
}

// ---- Grille tarifaire (partagée par le Budget Freelance) ----
async function refreshRatesPanel(){
  const wrap = document.getElementById("ratesWrap");
  if(!wrap) return;
  const data = await getRates();
  const leaders = data.leaders || DEFAULT_LEADERS;
  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Chef d'équipe</th><th>Tech (Rs)</th><th>Déco (Rs)</th><th>Transport /voiture (Rs)</th></tr></thead>
      <tbody id="ratesBody">
        ${leaders.map(l=>`<tr data-leader="${esc(l)}" style="white-space:nowrap;">
          <td>${esc(l)}</td>
          <td><input type="text" inputmode="numeric" data-rate="Tech" value="${(data.rates[l]&&data.rates[l].Tech!=null)?data.rates[l].Tech:''}"></td>
          <td><input type="text" inputmode="numeric" data-rate="Deco" value="${(data.rates[l]&&data.rates[l].Deco!=null)?data.rates[l].Deco:''}"></td>
          <td><input type="text" inputmode="numeric" data-transport="1" value="${(data.transport&&data.transport[l]!=null)?data.transport[l]:''}"></td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>
    <p class="muted" style="font-size:12px;margin-top:8px;">Transport calculé par palier de 5 personnes : 1-5 pax = 1 voiture, 6-10 = 2 voitures, 11-15 = 3, etc. Laisser vide pour utiliser Rs 2000/voiture par défaut.</p>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn-ghost btn-sm" id="addLeaderBtn">Ajouter un chef d'équipe</button>
      <button class="btn-primary btn-sm" id="saveRatesBtn">Enregistrer la grille</button>
    </div>`;
  document.getElementById("addLeaderBtn").onclick = ()=>{
    const name = prompt("Nom du chef d'équipe à ajouter :");
    if(!name) return;
    const tbody = document.getElementById("ratesBody");
    const tr = document.createElement("tr"); tr.dataset.leader = name;
    tr.innerHTML = `<td>${esc(name)}</td><td><input type="text" inputmode="numeric" data-rate="Tech"></td><td><input type="text" inputmode="numeric" data-rate="Deco"></td><td><input type="text" inputmode="numeric" data-transport="1"></td>`;
    tbody.appendChild(tr);
  };
  document.getElementById("saveRatesBtn").onclick = async ()=>{
    const rows = document.querySelectorAll("#ratesBody tr");
    const newLeaders = []; const newRates = {}; const newTransport = {};
    rows.forEach(tr=>{
      const l = tr.dataset.leader;
      newLeaders.push(l);
      const tech = tr.querySelector('[data-rate="Tech"]').value.trim();
      const deco = tr.querySelector('[data-rate="Deco"]').value.trim();
      const transport = tr.querySelector('[data-transport]').value.trim();
      newRates[l] = { Tech: tech===""?null:Number(tech), Deco: deco===""?null:Number(deco) };
      newTransport[l] = transport===""?null:Number(transport);
    });
    const ok = await saveRates({ leaders:newLeaders, rates:newRates, transport:newTransport });
    showToast(ok ? "Grille enregistrée" : "Erreur d'enregistrement");
  };
}

render();
</script>
</body>
</html>
